<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEP</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <main>
        <div class="dados">

            <h1>Cadastro</h1>

            <div class="container-campos">
                <input type="text" id="nome" placeholder="Nome" class="caixa-input">
                <input type="number" id="cep" placeholder="CEP" class="caixa-input">
                <input type="text" id="endereco" placeholder="Endereco" class="caixa-input">
                <input type="number" id="numero" placeholder="Número"  class="caixa-input">
                <input type="text" id="bairro" placeholder="Bairro" class="caixa-input">
                <input type="text" id="cidade" placeholder="Cidade" class="caixa-input">
                <input type="text" id="estado" placeholder="Estado" class="caixa-input">

            </div>

            <button>Cadastrar</button>

        </div>

    </main>

</body>

</html>
